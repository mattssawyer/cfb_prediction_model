[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfb-predictor"
version = "0.1.0"
description = "Weekly college football winner prediction pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matthew Sawyer" }]
dependencies = [
    "cfbd>=5.7.0",
    "lightgbm>=4.0",
    "numpy>=2.0",
    "pandas>=2.0",
    "pyarrow>=16.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
tune = [
    "optuna>=4.0",
]

[project.scripts]
cfb-train = "scripts.train:main"
cfb-pipeline = "scripts.pipeline:main"
cfb-tune = "scripts.tune:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cfb*"]
